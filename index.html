<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho Digital Store</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @keyframes rgbFlow {
      0% { background-position: 0% 0%; }
      50% { background-position: 0% 100%; }
      100% { background-position: 0% 0%; }
    }
    body {
      background: linear-gradient(180deg, #162447, #ff3366, #1f4068, #e43f5a);
      background-size: 400% 400%;
      animation: rgbFlow 10s ease infinite;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 600px; margin: auto; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 12px; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
    button { background: #ff3366; color: white; font-weight: bold; cursor: pointer; }
    .product-card, .history-item { background: rgba(255,255,255,0.1); padding: 12px; margin: 10px 0; border-radius: 8px; }
    .hidden { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .menu-dropdown { position: relative; display: inline-block; }
    .dropdown-content { display: none; position: absolute; right: 0; background-color: #222; min-width: 150px; box-shadow: 0px 8px 16px rgba(0,0,0,0.3); z-index: 1; border-radius: 6px; }
    .dropdown-content button { background: none; color: white; text-align: left; padding: 10px; margin: 0; width: 100%; }
    .dropdown-content button:hover { background: #444; }
    .menu-dropdown:hover .dropdown-content { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h2>🛍️ Meesho Store</h2>
    <div class="menu-dropdown">
      <button style="width:auto; padding:8px 14px; font-size:18px;">⋮</button>
      <div class="dropdown-content">
        <button onclick="switchTab('store')">Store</button>
        <button onclick="switchTab('myPurchases')">My Purchases</button>
        <button onclick="switchTab('auth')">Login / Signup</button>
        <button onclick="switchTab('admin')">Admin Panel</button>
      </div>
    </div>
  </div>
  
  <div id="authTab" class="hidden">
    <h3>👤 User Login / Signup</h3>
    <input type="text" id="authEmail" placeholder="Enter Email or Phone">
    <input type="password" id="authPass" placeholder="Enter Password">
    <button onclick="handleAuth()">Submit</button>
  </div>

  <div id="storeTab">
    <h3>Available Products</h3>
    <div id="productList"></div>
  </div>

  <div id="purchasesTab" class="hidden">
    <h3>📦 Your Purchased History & Downloads</h3>
    <div id="buyerPurchaseList"></div>
  </div>

  <div id="adminTab" class="hidden">
    <h3>🔐 Admin Panel (Default Pass: 8535)</h3>
    <div id="adminLogin">
      <input type="password" id="adminPassInput" placeholder="Enter Admin Password">
      <button onclick="loginAdmin()">Login</button>
    </div>
    
    <div id="adminDashboard" class="hidden">
      <h4>Manage Products & Upload Files</h4>
      <input type="text" id="pName" placeholder="Product Name">
      <input type="number" id="pPrice" placeholder="Price (₹)">
      <input type="text" id="pCategory" placeholder="Category">
      <label>Upload Digital File:</label>
      <input type="file" id="pFile">
      <button onclick="addProduct()">Add Product</button>

      <h4>Change Admin Password</h4>
      <input type="password" id="newPass" placeholder="Enter New Password">
      <input type="password" id="confirmPass" placeholder="Confirm Password">
      <div style="display:flex; align-items:center; gap:5px;">
        <input type="checkbox" id="showPassToggle" onclick="togglePasswordVisibility()" style="width:20px;">
        <label for="showPassToggle">Show Passwords</label>
      </div>
      <button onclick="updateAdminPassword()">Update Password</button>

      <h4>Sales History</h4>
      <div id="adminSalesHistory"></div>
      <button onclick="logoutAdmin()">Logout Admin</button>
    </div>
  </div>
</div>
<script>
  let adminPassword = localStorage.getItem('adminPass') || '8535';
  let products = JSON.parse(localStorage.getItem('products')) || [];
  let purchases = JSON.parse(localStorage.getItem('purchases')) || [];
  let currentUser = localStorage.getItem('currentUser') || null;

  function switchTab(tab) {
    document.getElementById('authTab').classList.add('hidden');
    document.getElementById('storeTab').classList.add('hidden');
    document.getElementById('purchasesTab').classList.add('hidden');
    document.getElementById('adminTab').classList.add('hidden');
    
    if(tab === 'auth') {
      document.getElementById('authTab').classList.remove('hidden');
    } else if(tab === 'store') {
      document.getElementById('storeTab').classList.remove('hidden');
      renderProducts();
    } else if(tab === 'myPurchases') {
      document.getElementById('purchasesTab').classList.remove('hidden');
      renderBuyerPurchases();
    } else if(tab === 'admin') {
      document.getElementById('adminTab').classList.remove('hidden');
    }
  }

  function handleAuth() {
    let email = document.getElementById('authEmail').value;
    if(!email) { alert('Please enter email/phone'); return; }
    currentUser = email;
    localStorage.setItem('currentUser', currentUser);
    alert('Logged in successfully!');
    switchTab('store');
  }

  function loginAdmin() {
    let val = document.getElementById('adminPassInput').value;
    if(val === adminPassword) {
      document.getElementById('adminLogin').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      renderAdminSales();
    } else {
      alert('Wrong Password!');
    }
  }

  function logoutAdmin() {
    document.getElementById('adminLogin').classList.remove('hidden');
    document.getElementById('adminDashboard').classList.add('hidden');
    document.getElementById('adminPassInput').value = '';
  }

  function togglePasswordVisibility() {
    let p1 = document.getElementById('newPass');
    let p2 = document.getElementById('confirmPass');
    let type = p1.type === 'password' ? 'text' : 'password';
    p1.type = type;
    p2.type = type;
  }

  function updateAdminPassword() {
    let p1 = document.getElementById('newPass').value;
    let p2 = document.getElementById('confirmPass').value;
    if(!p1) { alert('Password cannot be empty'); return; }
    if(p1 !== p2) { alert('Passwords do not match!'); return; }
    adminPassword = p1;
    localStorage.setItem('adminPass', adminPassword);
    alert('Admin password updated successfully!');
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
  }

  function addProduct() {
    let name = document.getElementById('pName').value;
    let price = document.getElementById('pPrice').value;
    let category = document.getElementById('pCategory').value;
    let fileInput = document.getElementById('pFile');

    if(!name || !price) { alert('Fill product details!'); return; }

    if(fileInput.files.length > 0) {
      let reader = new FileReader();
      reader.onload = function(e) {
        saveProductData(name, price, category, e.target.result, fileInput.files[0].name);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      saveProductData(name, price, category, '', '');
    }
  }

  function saveProductData(name, price, category, fileData, fileName) {
    products.push({ id: Date.now(), name, price, category, fileData, fileName });
    localStorage.setItem('products', JSON.stringify(products));
    alert('Product added successfully!');
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pCategory').value = '';
    document.getElementById('pFile').value = '';
    renderProducts();
  }

  function renderProducts() {
    let list = document.getElementById('productList');
    list.innerHTML = '';
    if(products.length === 0) { list.innerHTML = '<p>No products available.</p>'; return; }
    
    products.forEach((p, idx) => {
      list.innerHTML += `
        <div class="product-card">
          <h4>${p.name} (₹${p.price})</h4>
          <p>Category: ${p.category || 'General'}</p>
          <input type="text" id="utr_${idx}" placeholder="Enter UPI UTR Number">
          <button onclick="buyProduct(${idx})">Buy & Verify UTR</button>
        </div>
      `;
    });
  }

  function buyProduct(idx) {
    let utr = document.getElementById(`utr_${idx}`).value;
    if(!utr) { alert('Please enter UTR number!'); return; }
    
    let p = products[idx];
    purchases.push({
      user: currentUser || 'Guest',
      productName: p.name,
      price: p.price,
      utr: utr,
      fileData: p.fileData,
      fileName: p.fileName,
      date: new Date().toLocaleString()
    });
    localStorage.setItem('purchases', JSON.stringify(purchases));
    alert('Payment verified and added to your purchases!');
    document.getElementById(`utr_${idx}`).value = '';
    switchTab('myPurchases');
  }

  function renderBuyerPurchases() {
    let list = document.getElementById('buyerPurchaseList');
    list.innerHTML = '';
    if(purchases.length === 0) { list.innerHTML = '<p>No purchases yet.</p>'; return; }

    purchases.forEach(item => {
      let downloadBtn = item.fileData ? `<a href="${item.fileData}" download="${item.fileName}"><button style="background:#28a745;">Download ${item.fileName}</button></a>` : '<p>No downloadable file attached.</p>';
      list.innerHTML += `
        <div class="history-item">
          <h4>${item.productName} - ₹${item.price}</h4>
          <p>UTR: ${item.utr} | Date: ${item.date}</p>
          ${downloadBtn}
        </div>
      `;
    });
  }

  function renderAdminSales() {
    let list = document.getElementById('adminSalesHistory');
    list.innerHTML = '';
    if(purchases.length === 0) { list.innerHTML += '<p>No sales recorded.</p>'; return; }

    purchases.forEach(item => {
      list.innerHTML += `
        <div class="history-item">
          <p><b>User:</b> ${item.user}<br><b>Product:</b> ${item.productName} (₹${item.price})<br><b>UTR:</b> ${item.utr}<br><b>Date:</b> ${item.date}</p>
        </div>
      `;
    });
  }

  renderProducts();
</script>
</body>
</html>
