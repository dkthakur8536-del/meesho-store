<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho Digital Store</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @keyframes rgbFlow {
      0% { background-position: 0% 0%; }
      50% { background-position: 0% 100%; }
      100% { background-position: 0% 0%; }
    }
    body {
      background: linear-gradient(180deg, #162447, #ff3366, #1f4068, #e43f5a);
      background-size: 400% 400%;
      animation: rgbFlow 10s ease infinite;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 600px; margin: auto; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 12px; }
    input, select, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
    button { background: #ff3366; color: white; font-weight: bold; cursor: pointer; }
    .product-card, .history-item { background: rgba(255,255,255,0.1); padding: 12px; margin: 10px 0; border-radius: 8px; }
    .hidden { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .menu-dropdown { position: relative; display: inline-block; }
    .dropdown-content { display: none; position: absolute; right: 0; background-color: #222; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.3); z-index: 1; border-radius: 6px; }
    .dropdown-content button { background: none; color: white; text-align: left; padding: 10px; margin: 0; width: 100%; }
    .dropdown-content button:hover { background: #444; }
    .menu-dropdown:hover .dropdown-content { display: block; }
    .admin-section { background: rgba(255,255,255,0.05); padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
    .link-text { color: #ff3366; cursor: pointer; text-decoration: underline; text-align: center; margin: 5px 0; display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h2>🛍️ Meesho Store</h2>
    <div class="menu-dropdown" id="menuBar" style="display:none;">
      <button style="width:auto; padding:8px 14px; font-size:18px;">⋮</button>
      <div class="dropdown-content">
        <button onclick="switchTab('store')">Store</button>
        <button onclick="switchTab('myPurchases')">My Purchases</button>
        <button onclick="logoutUser()">Logout</button>
        <button onclick="switchTab('admin')">Admin Panel</button>
      </div>
    </div>
  </div>
  
  <!-- AUTH SECTION -->
  <div id="authContainer">
    <h3 id="authTitle">🔐 User Signup</h3>
    <input type="text" id="authEmail" placeholder="Enter Email or Phone">
    <input type="password" id="authPass" placeholder="Enter Password">
    <input type="password" id="authConfirmPass" placeholder="Confirm Password">
    <div style="display:flex; align-items:center; gap:5px;">
      <input type="checkbox" id="userShowPass" onclick="toggleUserPassword()" style="width:20px;">
      <label for="userShowPass">Show Passwords</label>
    </div>
    <button id="authBtn" onclick="handleUserAuth()">Register & Login</button>
    <span id="authToggleText" class="link-text" onclick="toggleAuthMode()">Already have an account? Login here</span>
    <span class="link-text" onclick="forgotPassword()">Forgot Password?</span>
    <span class="link-text" onclick="switchTab('admin')" style="margin-top:15px; color:#aaa;">Go to Admin Panel</span>
  </div>

  <!-- STORE TAB -->
  <div id="storeTab" class="hidden">
    <h3>Available Products</h3>
    <div id="productList"></div>
  </div>

  <!-- PURCHASES TAB -->
  <div id="purchasesTab" class="hidden">
    <h3>📦 Your Purchased History & Content</h3>
    <div id="buyerPurchaseList"></div>
  </div>

  <!-- ADMIN PANEL TAB -->
  <div id="adminTab" class="hidden">
    <h3>🔐 Admin Panel (Default Pass: 8535)</h3>
    <div id="adminLogin">
      <input type="password" id="adminPassInput" placeholder="Enter Admin Password">
      <button onclick="loginAdmin()">Login</button>
      <span class="link-text" onclick="switchTab('auth')">Back to User Store</span>
    </div>
    
    <div id="adminDashboard" class="hidden">
      
      <!-- 1. Add Stock / Products Section -->
      <div class="admin-section">
        <button onclick="toggleAdminView('addProductBox')">📦 Add Stock / Items</button>
        <div id="addProductBox" class="hidden">
          <h4>Add Item to Category</h4>
          <input type="text" id="pCategory" placeholder="Category Name (e.g., Netflix, Notes)">
          <input type="text" id="pName" placeholder="Item Name">
          <input type="number" id="pPrice" placeholder="Price (₹)">
          
          <label>Select Format Type:</label>
          <select id="pType" onchange="toggleFormatInput()">
            <option value="file">File Upload</option>
            <option value="text">Text / Account Details Format</option>
          </select>

          <div id="fileInputDiv">
            <label>Upload File:</label>
            <input type="file" id="pFile">
          </div>
          <div id="textInputDiv" class="hidden">
            <textarea id="pTextContent" placeholder="Enter text details or account info here..."></textarea>
          </div>

          <button onclick="addProduct()">Save Item</button>
        </div>
      </div>

      <!-- 2. Manage Category & Prices Section -->
      <div class="admin-section">
        <button onclick="toggleAdminView('manageCategoryBox'); loadAdminCategories();">⚙️ Manage Category & Prices</button>
        <div id="manageCategoryBox" class="hidden">
          <h4>Existing Categories & Items</h4>
          <div id="categoryManageList"></div>
        </div>
      </div>

      <!-- 3. Security / Password Settings Section -->
      <div class="admin-section">
        <button onclick="toggleAdminView('securityBox')">🔒 Security & Password Settings</button>
        <div id="securityBox" class="hidden">
          <h4>Change Admin Password</h4>
          <input type="password" id="newPass" placeholder="Enter New Password">
          <input type="password" id="confirmPass" placeholder="Confirm Password">
          <div style="display:flex; align-items:center; gap:5px;">
            <input type="checkbox" id="showPassToggle" onclick="toggleAdminPassword()" style="width:20px;">
            <label for="showPassToggle">Show Passwords</label>
          </div>
          <button onclick="updateAdminPassword()">Update Password</button>
        </div>
      </div>

      <!-- 4. Sales & Users History Section -->
      <div class="admin-section">
        <button onclick="toggleAdminView('historyBox'); loadAdminHistory();">📊 Users & Sales History</button>
        <div id="historyBox" class="hidden">
          <div id="adminUsersList"></div>
          <div id="adminSalesHistory"></div>
        </div>
      </div>

      <button onclick="logoutAdmin()" style="background:#444; margin-top:15px;">Logout Admin</button>
    </div>
  </div>
</div>
<!-- Firebase SDK CDN -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let adminPassword = localStorage.getItem('adminPass') || '8535';
  let currentUser = localStorage.getItem('currentUser') || null;
  let isLoginMode = false;

  // Persistent session check on load
  window.onload = function() {
    if (currentUser) {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('menuBar').style.display = 'block';
      switchTab('store');
    }
  };

  function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    if(isLoginMode) {
      document.getElementById('authTitle').innerText = '🔐 User Login';
      document.getElementById('authBtn').innerText = 'Login';
      document.getElementById('authConfirmPass').style.display = 'none';
      document.getElementById('authToggleText').innerText = "Don't have an account? Signup here";
    } else {
      document.getElementById('authTitle').innerText = '🔐 User Signup';
      document.getElementById('authBtn').innerText = 'Register & Login';
      document.getElementById('authConfirmPass').style.display = 'block';
      document.getElementById('authToggleText').innerText = "Already have an account? Login here";
    }
  }

  function toggleUserPassword() {
    let p1 = document.getElementById('authPass');
    let p2 = document.getElementById('authConfirmPass');
    let type = p1.type === 'password' ? 'text' : 'password';
    p1.type = type;
    p2.type = type;
  }

  function handleUserAuth() {
    let email = document.getElementById('authEmail').value.trim().replace(/[.#$\[\]]/g, "_");
    let pass = document.getElementById('authPass').value;
    let confirmPass = document.getElementById('authConfirmPass').value;

    if(!email || !pass) { alert('Please fill all fields!'); return; }

    db.ref('users/' + email).once('value', (snapshot) => {
      let userData = snapshot.val();
      if(!isLoginMode) {
        if(pass !== confirmPass) { alert('Passwords do not match!'); return; }
        if(userData) { alert('User already exists! Please login.'); return; }
        
        db.ref('users/' + email).set({ email, pass, date: new Date().toLocaleString() });
        alert('Signup successful!');
      } else {
        if(!userData || userData.pass !== pass) { alert('Invalid email or password!'); return; }
      }

      currentUser = email;
      localStorage.setItem('currentUser', currentUser);
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('menuBar').style.display = 'block';
      switchTab('store');
    });
  }

  function forgotPassword() {
    let email = prompt('Enter your registered email or phone:').trim().replace(/[.#$\[\]]/g, "_");
    db.ref('users/' + email).once('value', (snapshot) => {
      let user = snapshot.val();
      if(user) { alert(`Your password is: ${user.pass}`); }
      else { alert('User not found!'); }
    });
  }

  function logoutUser() {
    currentUser = null;
    localStorage.removeItem('currentUser');
    document.getElementById('menuBar').style.display = 'none';
    document.getElementById('storeTab').classList.add('hidden');
    document.getElementById('purchasesTab').classList.add('hidden');
    document.getElementById('adminTab').classList.add('hidden');
    document.getElementById('authContainer').classList.remove('hidden');
  }

  function switchTab(tab) {
    document.getElementById('authContainer').classList.add('hidden');
    document.getElementById('storeTab').classList.add('hidden');
    document.getElementById('purchasesTab').classList.add('hidden');
    document.getElementById('adminTab').classList.add('hidden');
    
    if(tab === 'auth') {
      document.getElementById('authContainer').classList.remove('hidden');
    } else if(tab === 'store') {
      if(!currentUser) { document.getElementById('authContainer').classList.remove('hidden'); return; }
      document.getElementById('storeTab').classList.remove('hidden');
      renderProducts();
    } else if(tab === 'myPurchases') {
      if(!currentUser) { document.getElementById('authContainer').classList.remove('hidden'); return; }
      document.getElementById('purchasesTab').classList.remove('hidden');
      renderBuyerPurchases();
    } else if(tab === 'admin') {
      document.getElementById('adminTab').classList.remove('hidden');
    }
  }

  function loginAdmin() {
    let val = document.getElementById('adminPassInput').value;
    if(val === adminPassword) {
      document.getElementById('adminLogin').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadAdminCategories();
    } else {
      alert('Wrong Password!');
    }
  }

  function logoutAdmin() {
    document.getElementById('adminLogin').classList.remove('hidden');
    document.getElementById('adminDashboard').classList.add('hidden');
    document.getElementById('adminPassInput').value = '';
  }

  function toggleAdminView(boxId) {
    let box = document.getElementById(boxId);
    box.classList.toggle('hidden');
  }

  function toggleFormatInput() {
    let type = document.getElementById('pType').value;
    if(type === 'file') {
      document.getElementById('fileInputDiv').classList.remove('hidden');
      document.getElementById('textInputDiv').classList.add('hidden');
    } else {
      document.getElementById('fileInputDiv').classList.add('hidden');
      document.getElementById('textInputDiv').classList.remove('hidden');
    }
  }

  function toggleAdminPassword() {
    let p1 = document.getElementById('newPass');
    let p2 = document.getElementById('confirmPass');
    let type = p1.type === 'password' ? 'text' : 'password';
    p1.type = type;
    p2.type = type;
  }

  function updateAdminPassword() {
    let p1 = document.getElementById('newPass').value;
    let p2 = document.getElementById('confirmPass').value;
    if(!p1) { alert('Password cannot be empty'); return; }
    if(p1 !== p2) { alert('Passwords do not match!'); return; }
    adminPassword = p1;
    localStorage.setItem('adminPass', adminPassword);
    alert('Admin password updated successfully!');
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
  }

  function addProduct() {
    let category = document.getElementById('pCategory').value.trim() || 'General';
    let name = document.getElementById('pName').value.trim();
    let price = document.getElementById('pPrice').value.trim();
    let type = document.getElementById('pType').value;

    if(!name || !price) { alert('Fill item name and price!'); return; }

    if(type === 'file') {
      let fileInput = document.getElementById('pFile');
      if(fileInput.files.length === 0) { alert('Please upload a file!'); return; }
      let reader = new FileReader();
      reader.onload = function(e) {
        saveProductToDB(category, name, price, type, e.target.result, fileInput.files[0].name);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      let textContent = document.getElementById('pTextContent').value.trim();
      if(!textContent) { alert('Please enter text content!'); return; }
      saveProductToDB(category, name, price, type, textContent, 'text_format');
    }
  }

  function saveProductToDB(category, name, price, type, content, fileName) {
    let newRef = db.ref('products').push();
    newRef.set({ id: newRef.key, category, name, price, type, content, fileName });
    alert('Item added successfully!');
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pFile').value = '';
    document.getElementById('pTextContent').value = '';
    loadAdminCategories();
  }

  function renderProducts() {
    db.ref('products').once('value', (snapshot) => {
      let list = document.getElementById('productList');
      list.innerHTML = '';
      let products = snapshot.val();
      if(!products) { list.innerHTML = '<p>No products available.</p>'; return; }
      
      Object.keys(products).forEach((key) => {
        let p = products[key];
        list.innerHTML += `
          <div class="product-card">
            <h4>${p.name} (₹${p.price})</h4>
            <p><b>Category:</b> ${p.category}</p>
            <input type="text" id="utr_${key}" placeholder="Enter UPI UTR Number">
            <button onclick="buyProduct('${key}', '${p.name}', '${p.price}')">Buy & Verify UTR</button>
          </div>
        `;
      });
    });
  }

  function buyProduct(key, name, price) {
    let utr = document.getElementById(`utr_${key}`).value.trim();
    if(!utr) { alert('Please enter UTR number!'); return; }
    
    db.ref('products/' + key).once('value', (snapshot) => {
      let p = snapshot.val();
      let purchaseRef = db.ref('purchases').push();
      purchaseRef.set({
        user: currentUser,
        productName: name,
        price: price,
        utr: utr,
        type: p.type,
        content: p.content,
        fileName: p.fileName,
        date: new Date().toLocaleString()
      });
      alert('Payment verified! Added to your purchases.');
      document.getElementById(`utr_${key}`).value = '';
      switchTab('myPurchases');
    });
  }

  function renderBuyerPurchases() {
    db.ref('purchases').once('value', (snapshot) => {
      let list = document.getElementById('buyerPurchaseList');
      list.innerHTML = '';
      let purchases = snapshot.val();
      if(!purchases) { list.innerHTML = '<p>No purchases yet.</p>'; return; }

      let count = 0;
      Object.keys(purchases).forEach((key) => {
        let item = purchases[key];
        if(item.user === currentUser) {
          count++;
          let deliveryContent = '';
          if(item.type === 'file') {
            deliveryContent = `<a href="${item.content}" download="${item.fileName}"><button style="background:#28a745;">Download ${item.fileName}</button></a>`;
          } else {
            deliveryContent = `<div style="background:rgba(0,0,0,0.5); padding:8px; border-radius:4px; margin-top:5px;"><b>Details:</b> <pre style="white-space:pre-wrap;">${item.content}</pre></div>`;
          }

          list.innerHTML += `
            <div class="history-item">
              <h4>${item.productName} - ₹${item.price}</h4>
              <p>UTR: ${item.utr} | Date: ${item.date}</p>
              ${deliveryContent}
            </div>
          `;
        }
      });
      if(count === 0) { list.innerHTML = '<p>No purchases yet.</p>'; }
    });
  }

  function loadAdminCategories() {
    db.ref('products').once('value', (snapshot) => {
      let cList = document.getElementById('categoryManageList');
      cList.innerHTML = '';
      let products = snapshot.val();
      if(!products) { cList.innerHTML = '<p>No items found.</p>'; return; }

      Object.keys(products).forEach((key) => {
        let p = products[key];
        cList.innerHTML += `
          <div style="background:rgba(255,255,255,0.05); padding:8px; margin:5px 0; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            <div><b>[${p.category}]</b> ${p.name} - ₹${p.price}</div>
            <button onclick="deleteProduct('${key}')" style="width:auto; background:#d9534f; padding:5px 10px; margin:0;">Delete</button>
          </div>
        `;
      });
    });
  }

  function loadAdminHistory() {
    db.ref('users').once('value', (snapshot) => {
      let uList = document.getElementById('adminUsersList');
      uList.innerHTML = '<h5>Registered Users:</h5>';
      let users = snapshot.val();
      if(!users) { uList.innerHTML += '<p>No users registered.</p>'; }
      else {
        Object.keys(users).forEach((key) => {
          let u = users[key];
          uList.innerHTML += `<div class="history-item"><p><b>User:</b> ${u.email} | <b>Joined:</b> ${u.date}</p></div>`;
        });
      }
    });

    db.ref('purchases').once('value', (snapshot) => {
      let sList = document.getElementById('adminSalesHistory');
      sList.innerHTML = '<h5>All Sales History:</h5>';
      let purchases = snapshot.val();
      if(!purchases) { sList.innerHTML += '<p>No sales recorded.</p>'; return; }

      Object.keys(purchases).forEach((key) => {
        let item = purchases[key];
        sList.innerHTML += `
          <div class="history-item">
            <p><b>Buyer:</b> ${item.user}<br><b>Item:</b> ${item.productName} (₹${item.price})<br><b>UTR:</b> ${item.utr}<br><b>Date:</b> ${item.date}</p>
          </div>
        `;
      });
    });
  }

  function deleteProduct(key) {
    if(confirm('Are you sure you want to delete this item?')) {
      db.ref('products/' + key).remove();
      alert('Item deleted successfully!');
      loadAdminCategories();
    }
  }
</script>
</body>
</html>
